/* ---- Neues Design (Wunsch des Nutzers 19.11.2026): rot-schwarz wie Baki, Banner, Kategorien, Effekte beim Scrollen und Hovern ---- */
:root{--a1:#ff3131;--a2:#d90b0b;--a3:#6b0000;--bg:#070505;--bg2:#0e0909;--card:#120c0c;--card2:#1b1111;--line:#2a1717;--muted:#a8928f}
body::before{background:radial-gradient(55% 45% at 10% 0%,rgba(217,11,11,.22),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(107,0,0,.35),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}

.brand span{background:linear-gradient(90deg,#fff,#ff6b6b 60%,#d90b0b);-webkit-background-clip:text;background-clip:text}

.banner::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 70%,var(--bg)),radial-gradient(60% 80% at 50% 120%,rgba(217,11,11,.35),transparent 70%);opacity:.9}

.btn{background:linear-gradient(135deg,#ff3b3b,#d90b0b 55%,#8a0000);box-shadow:0 10px 30px rgba(217,11,11,.38)}

.sect{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:40px 0 4px}.sect h2{margin:0;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.03em;text-transform:uppercase;font-weight:900}

.card{position:relative;transform-style:preserve-3d;transition:transform .25s,border-color .25s,box-shadow .25s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(255,49,49,.18),transparent 45%)}

.pimg{background:radial-gradient(circle at 50% 35%,#2a1010,#0d0707)}

/* Geschäftskunden (Wunsch des Nutzers 19.11.2026, Regelbesteuerung ab 1.1.): Netto-Preise anzeigen; EU-Firma außerhalb

const REGEL=(S.vat||"regel")==="regel",r2=x=>Math.round(x*100)/100,EU={"Deutschland":"DE","Österreich":"AT","Belgien":"BE","Bulgarien":"BG","Dänemark":"DK",

agb:()=>`<h1>Allgemeine Geschäftsbedingungen</h1><h2>§ 1 Geltungsbereich</h2><p>Diese AGB gelten für alle Bestellungen über den Online-Shop „${esc(S.name||"Baki Cards")}“ von ${esc(L.owner)}, ${esc(L.street)}, ${esc(L.city)} (nachfolgend „wir“).</p>
<h2>§ 2 Vertragsschluss</h2><p>Die Darstellung der Produkte im Shop ist kein bindendes Angebot. Mit dem Klick auf „Zahlungspflichtig bestellen“ gibst du ein verbindliches Angebot ab. Der Vertrag kommt zustande, wenn wir die Bestellung per E-Mail bestätigen oder die Ware versenden; bei PayPal mit Abschluss der Zahlung.</p>
<h2>§ 3 Preise und Versand</h2><p>Alle Preise sind Endpreise. ${vatNote} Hinzu kommen Versandkosten gemäß <a href="#/versand">Versand &amp; Zahlung</a>. Wir liefern in die dort genannten Länder.</p>
<h2>§ 3a Lieferzeit und Vorbestellungen</h2><p>Lagerware versenden wir am selben oder nächsten Werktag nach Zahlungseingang. Bei Vorbestellungen hängt der Versand vom Erscheinen beim Hersteller ab; der angegebene Termin ist voraussichtlich. Verschiebt er sich um mehr als vier Wochen, kannst du kostenlos vom Kauf zurücktreten; bereits gezahlte Beträge erstatten wir umgehend.</p>
<h2>§ 4 Zahlung</h2><p>Möglich sind die unter „Versand &amp; Zahlung“ genannten Zahlungsarten. Bei Vorkasse und Kryptowährung versenden wir nach Zahlungseingang; geht die Zahlung nicht innerhalb von 7 Tagen ein, dürfen wir vom Vertrag zurücktreten.</p>

<h2>§ 7 Gewährleistung</h2><p>Es gilt das gesetzliche Mängelhaftungsrecht. Sammelkarten-Produkte sind versiegelte Zufallsprodukte; der Inhalt einzelner Packungen (Seltenheit, Wert) ist keine zugesicherte Eigenschaft.</p>

<p>Um dein Widerrufsrecht auszuüben, musst du uns (${esc(L.owner)}, ${esc(L.street)}, ${esc(L.city)}, E-Mail: ${esc(L.email)}${L.phone?", Telefon: "+esc(L.phone):""}) mittels einer eindeutigen Erklärung (z. B. ein mit der Post versandter Brief oder eine E-Mail) über deinen Entschluss, diesen Vertrag zu widerrufen, informieren. Du kannst dafür das unten stehende Muster-Widerrufsformular verwenden, das jedoch nicht vorgeschrieben ist. Zur Wahrung der Widerrufsfrist reicht es aus, dass du die Mitteilung über die Ausübung des Widerrufsrechts vor Ablauf der Widerrufsfrist absendest.</p>
<h2>Folgen des Widerrufs</h2><p>Wenn du diesen Vertrag widerrufst, haben wir dir alle Zahlungen, die wir von dir erhalten haben, einschließlich der Lieferkosten (mit Ausnahme der zusätzlichen Kosten, die sich daraus ergeben, dass du eine andere Art der Lieferung als die von uns angebotene, günstigste Standardlieferung gewählt hast), unverzüglich und spätestens binnen vierzehn Tagen ab dem Tag zurückzuzahlen, an dem die Mitteilung über deinen Widerruf dieses Vertrags bei uns eingegangen ist. Für diese Rückzahlung verwenden wir dasselbe Zahlungsmittel, das du bei der ursprünglichen Transaktion eingesetzt hast, es sei denn, mit dir wurde ausdrücklich etwas anderes vereinbart; in keinem Fall werden dir wegen dieser Rückzahlung Entgelte berechnet. Wir können die Rückzahlung verweigern, bis wir die Waren wieder zurückerhalten haben oder bis du den Nachweis erbracht hast, dass du die Waren zurückgesandt hast, je nachdem, welches der frühere Zeitpunkt ist.</p>
<p>Du hast die Waren unverzüglich und in jedem Fall spätestens binnen vierzehn Tagen ab dem Tag, an dem du uns über den Widerruf dieses Vertrags unterrichtest, an uns zurückzusenden oder zu übergeben. Die Frist ist gewahrt, wenn du die Waren vor Ablauf der Frist von vierzehn Tagen absendest. Du trägst die unmittelbaren Kosten der Rücksendung der Waren. Du musst für einen etwaigen Wertverlust der Waren nur aufkommen, wenn dieser Wertverlust auf einen zur Prüfung der Beschaffenheit, Eigenschaften und Funktionsweise der Waren nicht notwendigen Umgang mit ihnen zurückzuführen ist.</p>
<h2>Hinweis zu versiegelten Sammelkarten-Produkten</h2><p>Unsere Produkte werden neu und originalversiegelt (in Folie eingeschweißt) verkauft; ihr Wert hängt maßgeblich von diesem Zustand ab. Zur Prüfung der Ware ist es nicht notwendig, die Versiegelung zu öffnen. Wird die Folie bzw. Versiegelung geöffnet, eingerissen oder entfernt oder ist die Verpackung (z. B. der Karton) durch Umgang, der über die Prüfung hinausgeht, beschädigt oder geknickt, hast du für den dadurch entstandenen Wertverlust Wertersatz zu leisten. Dieser kann bis zur Höhe des Kaufpreises reichen. <b>Geöffnet heißt schon: Folie ab oder eingerissen. Bei geöffneten oder neu eingeschweißten Booster-Packs, Displays und Boxen entspricht der Wertverlust in der Regel dem vollen Kaufpreis; eine Erstattung entfällt dann vollständig.</b> Bitte sende Ware nur ungeöffnet und unbeschädigt sowie gut verpackt zurück.</p>

function legal(k){$("view").innerHTML=`<section class="wrap legal">${LEGAL[k]()}${k!=="versand"?`<p class="note">Stand: ${esc((S.updated||"").slice(0,10))}</p>`:""}</section>`;document.title=k[0].toUpperCase()+k.slice(1)+" – "+(S.name||"Baki Cards")}

function route(){const h=location.hash.replace(/^#\/?/,""),[a,b]=h.split("/");document.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x.dataset.r===(a||"home")));
if(a==="p")product(decodeURIComponent(b||""));else if(a==="warenkorb")cartView();else if(a==="kasse")checkout();else if(Object.hasOwn(LEGAL,a))legal(a);else home();if(a!=="")scrollTo(0,0)}
$("fline").innerHTML=`${esc(L.owner||"")}${L.city?" · "+esc(L.city):""}${L.email?` · <a href="mailto:${esc(L.email)}">${esc(L.email)}</a>`:""}`;
$("fpay").innerHTML=PAYS().map(([k,n])=>`<span>${n.split(" ")[0]}</span>`).join("");
const kt=()=>document.querySelectorAll("#kt button").forEach(b=>b.classList.toggle("on",(b.dataset.b==="1")===b2b));kt();
$("kt").onclick=e=>{const b=e.target.closest("[data-b]");if(!b)return;b2b=b.dataset.b==="1";try{localStorage.setItem("baki-b2b",b2b?"1":"0")}catch(x){}kt();route()};
addEventListener("hashchange",route);document.addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(b){e.preventDefault();add(b.dataset.add)}});saveCart();route();
</script></body></html>
