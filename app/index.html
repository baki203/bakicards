<script>
const IC={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>'},ic=k=>`<svg class="ii" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* Zwei Wege (Wunsch des Nutzers 19.11.2026): zu Hause direkt vom PC (WLAN, PIN), unterwegs über das Google-Skript

const HUB=(()=>{const h=new URLSearchParams(location.hash.slice(1));return /^https:\/\/script\.google\.com\//.test(h.get("g")||"")&&h.get("k")?{g:h.get("g"),k:h.get("k")}:null})();

function pcRow(p,i){const t=TRACK[p.carrier];return `<div class="row"><div class="pic">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.outerHTML=ic('box')">`:ic("box")}</div>
<div><b>${esc(p.name)}${+p.qty?` × ${+p.qty}`:""}${+p.more?` + ${+p.more}`:""}</b><small>${esc([p.shop,p.eta?"kommt "+p.eta:"unterwegs seit "+(p.date||"").split("-").reverse().join(".")].filter(Boolean).join(" · "))}</small>
${p.track?`<small>${esc((p.carrier||"").toUpperCase())} ${esc(p.track)}</small>`:""}</div><div class="acts">${p.track?`<button class="btn g" data-copy="${esc(p.track)}">⧉</button>`:""}${p.track&&t?`<a class="btn" href="${esc(t(p.track))}" target="_blank" rel="noopener">↗</a>`:""}</div></div>`}
function invRow(g){const d=g.since?days(g.since):null;return `<div class="row"><div class="pic">${g.img?`<img src="${esc(g.img)}" alt="" loading="lazy" onerror="this.replaceWith('▦')">`:"▦"}</div>
<div><b>${esc(g.name)}</b><small>${g.n} Stück · Ø ${money(g.ek/g.n)}${d!=null?` · liegt ${-d} Tage`:""}${g.photos?` · ${ic("cam")} ${g.photos}`:""}</small></div>
<button class="btn g" data-photo="${esc(g.name)}" aria-label="In-hand-Foto">${ic("cam")}</button></div>`}
function render(){if(!data)return;const s=data.stock,val=s.reduce((t,g)=>t+g.ek,0),pcs=s.reduce((t,g)=>t+g.n,0),week=data.releases.filter(r=>days(r.date)<=7);
$("kpis").innerHTML=`<div class="kpi"><small>Inventar</small><b class="acc">${pcs} Stück</b><small>${money(val)}</small></div><div class="kpi"><small>Pakete unterwegs</small><b>${data.inbound.length}</b></div>
<div class="kpi"><small>Releases 7 Tage</small><b>${week.length}</b></div><div class="kpi"><small>Einladungen</small><b>${data.invites.length}</b></div>`;
const inv=x=>{const h=Math.max(0,Math.round((x.until-Date.now()/1e3)/3600));
return `<div class="row"><div class="pic">${x.img?`<img src="${esc(x.img)}" alt="">`:"✉"}</div><div><b>${esc(x.title)}</b><small>${esc(x.to)} · noch ${h} h${x.price?" · "+money(x.price):""}</small></div>
<div class="acts"><button class="btn g" data-copy="${esc(x.to)}">⧉</button>${x.asin?`<a class="btn" href="https://www.amazon.de/dp/${esc(x.asin)}" target="_blank" rel="noopener">↗</a>`:""}</div></div>`};
$("homeInv").innerHTML=data.invites.length?`<h2>Einladungen</h2><div class="list">${data.invites.slice(0,3).map(inv).join("")}</div>`:"";
$("mailList").innerHTML=data.invites.map(inv).join("")||`<div class="empty">Keine aktive Einladung</div>`;
$("homeRel").innerHTML=data.releases.slice(0,4).map(relRow).join("")||`<div class="empty">Keine Releases in den nächsten Tagen</div>`;
$("homePc").innerHTML=data.inbound.slice(0,3).map(pcRow).join("")||`<div class="empty">Nichts unterwegs</div>`;
$("relList").innerHTML=data.releases.map(relRow).join("")||`<div class="empty">Keine Releases in den nächsten 30 Tagen</div>`;
$("pcList").innerHTML=data.inbound.map(pcRow).join("")||`<div class="empty">Nichts unterwegs</div>`;renderInv();
$("names").innerHTML=s.map(g=>"<option>"+esc(g.name)+"</option>").join("")}
function renderInv(){const q=$("invQ").value.trim().toLowerCase(),l=data?data.stock.filter(g=>!q||g.name.toLowerCase().includes(q)):[];
$("invList").innerHTML=l.map(invRow).join("")||`<div class="empty">${q?"Nichts gefunden":"Inventar ist leer"}</div>`}
function show(v){view=v;if(v==="pf")pfLoad();document.querySelectorAll("main section").forEach(s=>s.hidden=s.dataset.v!==v);document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.n===v));scrollTo(0,0)}
function addMode(m){document.querySelectorAll("#addSeg button").forEach(b=>b.classList.toggle("on",b.dataset.a===m));$("f").hidden=m!=="buy";$("pf").hidden=m!=="photo";$("msg").textContent=""}
/* Postfach (Wunsch des Nutzers 20.11.2026, prüft Mails sehr oft am Handy): direkt vom Cloudflare-Programm, nicht über PC
   oder Google. Adresse und Schlüssel kommen mit dem Handy-Link (#…&m=…&mk=…) und bleiben nur auf diesem Handy. */
const PF=(()=>{const h=new URLSearchParams(location.hash.slice(1));let m=h.get("m"),k=h.get("mk");
try{if(m&&k)localStorage.setItem("baki-pf",JSON.stringify({m,k}));else({m,k}=JSON.parse(localStorage.getItem("baki-pf")||"{}"))}catch(e){}
return /^https:\/\/[\w.-]+\.workers\.dev$/.test(m||"")&&k?{m,k}:null})();
const pfApi=b=>fetch(PF.m,{method:"POST",body:JSON.stringify({k:PF.k,...b})}).then(r=>r.json()).catch(()=>({error:"Keine Verbindung zum Postfach"}));
let pfItems=[],pfSeen=new Set(),pfT=0,pfCat="";try{pfSeen=new Set(JSON.parse(localStorage.getItem("baki-pf-seen")||"[]"))}catch(e){}
const pfWords=s=>String(s||"").replace(/=\?([^?]+)\?([BQ])\?([^?]*)\?=(?:\s+(?==\?))?/gi,(all,cs,e,t)=>{try{const b=e.toUpperCase()==="B"?atob(t):t.replace(/_/g," ").replace(/=([0-9A-F]{2})/gi,(x,h)=>String.fromCharCode(parseInt(h,16)));
return new TextDecoder(cs).decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}catch(x){return all}});
function pfMime(raw){   /* Mail zerlegen: Teile, Base64/Quoted-Printable, Zeichensatz; HTML bevorzugt, Anhänge nicht */
const cut=x=>{const i=x.search(/\r?\n\r?\n/);return i<0?[x,""]:[x.slice(0,i),x.slice(i).replace(/^\r?\n\r?\n/,"")]};
const head=x=>{const o={};x.replace(/\r?\n[ \t]+/g," ").split(/\r?\n/).forEach(l=>{const i=l.indexOf(":");if(i>0)o[l.slice(0,i).toLowerCase()]=l.slice(i+1).trim()});return o};
const dec=(b,enc,cs)=>{let s;if(enc==="base64"){s=atob(b.replace(/[^A-Za-z0-9+/=]/g,""))}else{s=b.replace(/=\r?\n/g,"").replace(/=([0-9A-F]{2})/gi,(x,h)=>String.fromCharCode(parseInt(h,16)))}
try{return new TextDecoder(cs||"utf-8").decode(Uint8Array.from(s,c=>c.charCodeAt(0)&255))}catch(e){return s}};
const out={};const walk=part=>{const[h,b]=cut(part),H=head(h),ct=H["content-type"]||"text/plain",cs=(/charset="?([^";\s]+)/i.exec(ct)||[])[1],bd=(/boundary="?([^";]+)"?/i.exec(ct)||[])[1];
if(/^multipart\//i.test(ct)&&bd){b.split("--"+bd).slice(1).forEach(p=>{if(!p.startsWith("--"))walk(p.replace(/^\r?\n/,""))});return}
if(/attachment/i.test(H["content-disposition"]||""))return;const enc=(H["content-transfer-encoding"]||"").toLowerCase(),t=/base64|quoted-printable/.test(enc)?dec(b,enc,cs):b;
if(/^text\/html/i.test(ct)&&!out.html)out.html=t;else if(/^text\/plain/i.test(ct)&&!out.text)out.text=t};
walk(raw);const H=head(cut(raw)[0]);out.subject=pfWords(H.subject);out.from=pfWords(H.from);return out}
const pfTime=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})};
async function pfLoad(){
if(!PF){$("pfList").innerHTML='<div class="empty">Postfach am PC einrichten (Postfach → ⚙), dann den Handy-Link neu öffnen.</div>';return}
const r=await pfApi({q:$("pfQ").value.trim(),cat:pfCat});if(r.error){if(view==="pf")$("pfList").innerHTML=`<div class="empty">${esc(r.error)}</div>`;return}
pfItems=r.items||[];if(!pfCat)$("navPf").classList.toggle("dot",pfItems.some(x=>!pfSeen.has(x.id)));
$("pfList").innerHTML=pfItems.map((x,i)=>`<div class="row nopic ${pfSeen.has(x.id)?"read":"unread"}" data-pf="${i}"><div><b>${esc(pfWords(x.subject)||"(ohne Betreff)")}</b><small>${esc(pfWords(x.sender).replace(/\s*<[^>]*>$/,"").replace(/^"|"$/g,""))} → ${esc(x.rcpt)}</small></div><small>${pfTime(x.t)}</small></div>`).join("")
||`<div class="empty">${$("pfQ").value.trim()?"Nichts gefunden.":"Noch keine Mail."}</div>`}
$("pfQ").oninput=()=>{clearTimeout(pfT);pfT=setTimeout(pfLoad,300)};
$("pfSeg").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;pfCat=b.dataset.c;$("pfSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));pfLoad()};
$("pfList").onclick=async e=>{const el=e.target.closest("[data-pf]"),x=pfItems[+el?.dataset.pf];if(!x)return;
const r=await pfApi({id:x.id});if(r.error)return alert(r.error);const m=pfMime(r.raw||"");
pfSeen.add(x.id);try{localStorage.setItem("baki-pf-seen",JSON.stringify([...pfSeen].slice(-3000)))}catch(err){}el.classList.replace("unread","read");
$("pfS").textContent=m.subject||pfWords(x.subject)||"(ohne Betreff)";$("pfM").textContent=`${m.from||pfWords(x.sender)} → ${x.rcpt} · ${new Date(x.t).toLocaleString("de-DE")}`;
$("pfF").srcdoc=`<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; style-src 'unsafe-inline' https:; font-src https: data:"><base target="_blank">`
+(m.html||`<pre style="white-space:pre-wrap;font:15px/1.5 system-ui;margin:14px">${esc(m.text||"")}</pre>`);$("pfView").hidden=false};
$("pfBack").onclick=()=>{$("pfView").hidden=true;$("pfF").srcdoc="";pfLoad()};
setInterval(()=>{if(!document.hidden&&$("pfView").hidden&&PF)pfLoad()},15e3);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PF)pfLoad()});if(PF)pfLoad();
$("nav").onclick=e=>{const b=e.target.closest("[data-n]");if(b)show(b.dataset.n)};$("addSeg").onclick=e=>{const b=e.target.closest("[data-a]");if(b)addMode(b.dataset.a)};
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy]"),p=e.target.closest("[data-photo]");
if(c)copy(c.dataset.copy);if(p){show("add");addMode("photo");$("pa").value=p.dataset.photo}});
$("invQ").addEventListener("input",renderInv);
$("scan").onclick=async()=>{const b=$("scan"),m=$("scanMsg");b.disabled=true;b.textContent="Suche in Gmail …";m.hidden=true;
const r=await API.scan();
b.disabled=false;b.innerHTML=ic("search")+" Gmail nach Einladungen durchsuchen";await load();
m.hidden=false;m.textContent=r?(r.errors&&r.errors.length?"Fehler: "+r.errors.join(", ")+" · ":"")+"✓ "+data.invites.length+" aktive Einladung"+(data.invites.length===1?"":"en"):OFF};$("reload").onclick=()=>load().then(ok=>ok&&toast("Aktuell"));$("retry").onclick=()=>{$("offMsg").textContent="…";load()};
$("gok").onclick=async()=>{pin=$("gpin").value.trim();if(await load()){try{localStorage.setItem("pin",pin)}catch(e){}}else $("gmsg").textContent="PIN falsch oder Baki AIO aus"};
$("gpin").addEventListener("keydown",e=>{if(e.key==="Enter")$("gok").click()});
$("d").value=today();
/* EK: „12,50“, „1.234,50“ und „12.50“ (Punkt als Komma auf englischer Tastatur); „1.234“ ist Tausend */
const parseEk=v=>{v=v.replace(/\s|€/g,"");return v.includes(",")?Number(v.replace(/\./g,"").replace(",",".")):/^\d{1,3}(\.\d{3})+$/.test(v)?Number(v.replace(/\./g,"")):Number(v)};
$("f").onsubmit=async ev=>{ev.preventDefault();const m=$("msg"),btn=$("f").querySelector("button");
const ek=$("e").value.trim()?parseEk($("e").value):null;
if(ek!=null&&!(ek>=0&&ek<1e5)){m.className="neg";m.textContent="EK prüfen";return}
m.className="";m.textContent="Sende …";btn.disabled=true;
const st=await API.buy({artikel:$("a").value.trim(),anzahl:Math.max(1,parseInt($("n").value)||1),ek,kauf:$("d").value,notiz:$("o").value.trim()});
if(st===200){m.className="pos";m.textContent="✓ "+$("a").value+(CLOUD?" gemerkt, kommt in Baki AIO an":" eingetragen");$("a").value="";$("e").value="";$("n").value=1;$("o").value=""}
else{m.className="neg";m.textContent=st===403?"PIN falsch":OFF}btn.disabled=false};
/* In-hand-Fotos: auf höchstens 2000 px verkleinert (reicht für eBay, Kleinanzeigen und Vinted), als JPEG gesendet */
let shots=[];
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,2000/Math.max(i.width,i.height)),c=document.createElement("canvas");
c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.9))};i.onerror=no;i.src=u});
$("pi").onchange=async()=>{for(const f of $("pi").files)try{shots.push(await shrink(f))}catch(e){}$("pi").value="";$("pt").innerHTML=shots.map(s=>'<img src="'+s+'" alt="">').join("")};
$("pf").onsubmit=async ev=>{ev.preventDefault();const m=$("msg");if(!shots.length){m.className="neg";m.textContent="Erst ein Foto aufnehmen";return}
const btn=$("ps"),all=shots.length;let n=0;btn.disabled=true;
while(shots.length){m.className="";m.textContent="Sende "+(n+1)+" von "+all+" …";
const st=await API.photo($("pa").value.trim(),shots[0]);
if(st!==200){m.className="neg";m.textContent=st===403?"PIN falsch":OFF;btn.disabled=false;return}
shots.shift();n++;$("pt").innerHTML=shots.map(s=>'<img src="'+s+'" alt="">').join("")}   /* gesendete gleich raus: kein Doppeltes beim erneuten Senden */
btn.disabled=false;m.className="pos";m.textContent="✓ "+n+" Foto"+(n>1?"s":"")+" für "+$("pa").value+" (am PC: Inventar → In-hand)";load()};
if(pin||CLOUD)load().then(ok=>{if(!ok&&$("app").hidden&&!CLOUD)$("gate").hidden=false});else $("gate").hidden=false;
setInterval(()=>{if(!document.hidden&&(pin||CLOUD)&&!$("app").hidden)load()},60e3);
/* zurück in die App (Home-Bildschirm): gleich den neuen Stand holen */
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(pin||CLOUD)&&!$("app").hidden)load()});
</script></body></html>
